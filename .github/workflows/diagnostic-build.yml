name: Diagnostic build
on:
  pull_request:
    branches:
      - claude/afrigrant-pipeline-setup-pMr0K
  push:
    branches:
      - codex/fix-emergency-reset-build

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
